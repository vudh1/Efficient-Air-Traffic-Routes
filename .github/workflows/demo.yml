name: Build, test, and refresh demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run portfolio demo
        run: ./build/valet_demo > demo-output.txt

      - name: Install GIF generator
        run: python3 -m pip install pillow

      - name: Generate GIF
        run: python3 scripts/generate_demo.py

      - name: Commit refreshed demo
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.gif
          if git diff --cached --quiet; then
            echo "Demo already current"
            exit 0
          fi
          git commit -m "docs: refresh animated valet demo"
          git push
